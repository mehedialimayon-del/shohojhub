name: Foundation QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Test signed-in chapters with isolated Supabase
        timeout-minutes: 15
        run: |
          npx --yes supabase@2.84.2 init
          # Reserve a non-default database port so the disposable CI stack does
          # not collide with services already bound on hosted runners.
          sed -i 's/^port = 54322$/port = 55432/' supabase/config.toml
          npx --yes supabase@2.84.2 start -x studio,imgproxy,edge-runtime,logflare,vector,postgres-meta
          stack=$(npx --yes supabase@2.84.2 status --output json)
          NEXT_PUBLIC_SUPABASE_URL=$(jq -er '.API_URL' <<< "$stack")
          NEXT_PUBLIC_SUPABASE_ANON_KEY=$(jq -er '.ANON_KEY' <<< "$stack")
          SHOHOJHUB_LOCAL_QA_SERVICE_KEY=$(jq -er '.SERVICE_ROLE_KEY' <<< "$stack")
          test "$NEXT_PUBLIC_SUPABASE_URL" = 'http://127.0.0.1:54321'
          export NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SHOHOJHUB_LOCAL_QA_SERVICE_KEY
          npm run test:browser -- tests/browser/post-lifecycle.spec.ts tests/browser/dashboard-connect.spec.ts --project=desktop --workers=1 --retries=0
